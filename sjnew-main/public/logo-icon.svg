<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Rounded Container -->
  <rect width="200" height="200" rx="36" fill="#0F172A"/>
  
  <!-- Subtle Border Accent -->
  <rect width="192" height="192" x="4" y="4" rx="32" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Geometric "SJ" Monogram Badge -->
  <g transform="translate(100, 100)">
    <!-- Shield / Diamond Outer Geometry -->
    <path d="M0,-65 L60,-30 L60,35 L0,70 L-60,35 L-60,-30 Z" fill="#1E293B" stroke="#334155" stroke-width="4"/>
    
    <!-- Left Accent Fold (Orange) -->
