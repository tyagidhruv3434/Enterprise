<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="600" height="180" rx="20" fill="#0F172A"/>
  <rect width="594" height="174" x="3" y="3" rx="17" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Left Icon Mark -->
  <g transform="translate(40, 25)">
    <!-- Outer Shield Frame -->
    <rect width="130" height="130" rx="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Hexagonal Crest -->
    <g transform="translate(65, 65)">
      <path d="M0,-48 L42,-22 L42,24 L0,48 L-42,24 L-42,-22 Z" fill="#0F172A" stroke="#475569" stroke-width="3"/>
      
      <!-- Color Flaps -->
      <path d="M-42,-22 L0,0 L0,48 L-42,24 Z" fill="#F97316"/>
      <path d="M0,-48 L42,-22 L0,0 Z" fill="#0284C7"/>
      
      <!-- Clean "SJ" Monogram -->
      <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
        SJ
      </text>
    </g>
  </g>

  <!-- Right Brand Name Typography -->
  <g transform="translate(200, 58)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="1">
      SJ <tspan fill="#F97316">SHARDA</tspan>
    </text>

    <!-- Sub-title: ENTERPRISES -->
    <text x="0" y="65" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#38BDF8" letter-spacing="8">
      ENTERPRISES
    </text>

    <!-- Divider Line -->
    <line x1="0" y1="78" x2="360" y2="78" stroke="#334155" stroke-width="2"/>

    <!-- Tagline -->
    <text x="0" y="96" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="2">
      TRADING • FABRICATION • MACHINING
    </text>
  </g>
</svg>
